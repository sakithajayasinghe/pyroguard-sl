server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name calit.online www.calit.online;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    root /var/www/pyroguard/dist;
    index index.html;

    server_name calit.online www.calit.online;

    client_max_body_size 15M;

    ssl_certificate /etc/letsencrypt/live/calit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calit.online/privkey.pem;

    # Basic SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SonarQube code-quality dashboard. Basic-Auth-gated at the proxy layer
    # since the app itself still runs on its default admin/admin123 login.
    location /sonar/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_sonar;

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

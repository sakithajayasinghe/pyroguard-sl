name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clean stale permissions
        run: |
          sudo -n rm -rf .scannerwork 2>/dev/null || rm -rf .scannerwork 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SonarQube Quality Scan
        run: |
          ./run-sonar.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Copy built assets to /var/www/pyroguard
        run: |
          sudo mkdir -p /var/www/pyroguard
          sudo rm -rf /var/www/pyroguard/dist
          sudo cp -r ./frontend/dist /var/www/pyroguard/
          sudo chown -R www-data:www-data /var/www/pyroguard

      - name: Configure Nginx
        run: |
          sudo cp ./nginx/pyroguard.conf /etc/nginx/sites-available/default
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Deploy Backend with Docker Compose
        run: |
          docker compose down
          docker compose up --build -d

      - name: System health check
        run: |
          echo "Checking if backend container is running..."
          docker ps
          sleep 5
          curl -f http://localhost:8000/api/v1/health || echo "Backend check failed"
